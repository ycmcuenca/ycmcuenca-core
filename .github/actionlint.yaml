# actionlint 1.7.12, the version CI pins, predates GitHub's `concurrency.queue`
# key, which deploy.yml uses so queued deploys of one app are never dropped
# (design D2 in openspec/changes/edge-infrastructure/design.md). This ignores
# that one message, for that one file only; every other finding still fails CI.
paths:
  .github/workflows/deploy.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
