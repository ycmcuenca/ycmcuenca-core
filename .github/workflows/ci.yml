# Continuous integration for every pull request targeting `main` and every
# push to `main` (design D1-D7 in openspec/changes/archive/2026-10-18-ci-release-pipeline/design.md).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded pull-request run is cancelled; runs on `main` never cancel each
# other (D2).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No token permissions by default; each job grants only what it needs (D2).
permissions: {}

# `bun install` runs the root `prepare` script (`lefthook install`) in CI; no
# hook may ever execute itself (D3).
env:
  LEFTHOOK: "0"

jobs:
  # One frozen install, then every check as its own named step, so a failure
  # names the check it came from (D1).
  verify:
    name: verify
    runs-on: ubuntu-24.04 # Pinned runner image, never `-latest` (A8).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Later steps cannot reuse the token (D2).
      # No version input: setup-bun reads `packageManager` from package.json (D3).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version # One source of truth (D3).
      - name: install
        run: bun install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          # Keyed per commit, restored from the newest entry for this OS:
          # Turborepo's task hashes decide validity, so a stale entry costs
          # nothing (D4).
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: format
        run: bun run format
      - name: lint
        run: bun run lint
      - name: check
        run: bun run check
      - name: build
        run: bun run build
      - name: test
        run: bun run test

  # The slowest job, so it runs in parallel with `verify` (D1). Only the
  # browser download is cached; the e2e task itself is never cached (D4).
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The suite drives a real `admin` against a real database (design D8 in
    # openspec/changes/content-store/design.md): the same image and digest
    # `compose.yaml` pins, on the service's own port. `e2e-only` is not a
    # secret — the container lives only as long as this job and only the runner
    # can reach it.
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: e2e-only
          POSTGRES_DB: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    # The two migrator URLs and the runtime login reach `db:prepare`;
    # `wrangler dev` gets the Hyperdrive local variable from the job's
    # environment, exactly as D6 describes for a workstation (D8).
    env:
      DATABASE_URL: postgres://postgres:e2e-only@127.0.0.1:5432/cms
      DATABASE_URL_TEST: postgres://postgres:e2e-only@127.0.0.1:5432/cms_test
      RUNTIME_ROLE_PASSWORD: e2e-runtime-role-password
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://cms_runtime:e2e-runtime-role-password@127.0.0.1:5432/cms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version input: setup-bun reads `packageManager` from package.json (D3).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: install
        run: bun install --frozen-lockfile
      # Creates the test database, applies both migrations and seeds the
      # runtime login, so the schema under the e2e run is the one a deploy
      # would create (D8).
      - name: Prepare the database
        run: bun run db:prepare
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Browsers change only when the Playwright pin in the lockfile does
          # (D4). The epoch is bumped when a cache entry holds a browser build
          # that the pin does not expect, which a hit cannot repair: entry 2
          # follows a run whose install fetched the newest Playwright instead
          # of the pinned one.
          key: playwright-${{ runner.os }}-epoch-2-${{ hashFiles('bun.lock') }}
      # A cache hit still needs the system packages, which are not cached (D4).
      # Run from an app so `bunx` resolves the pinned `@playwright/test` and
      # installs the browser build that pin expects; at the repository root
      # there is no local binary, so `bunx` downloads the newest published
      # Playwright and its browser, which the suite then cannot launch.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/welcome
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/welcome
        run: bunx playwright install-deps chromium
      - name: test:e2e
        run: bun run test:e2e

  # Every pull-request commit becomes a `main` commit under rebase-only
  # merging, so each one must be a Conventional Commit (D5). Pull requests
  # only: a commit that reached `main` was validated by the PR that carried it.
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint walks the whole PR range (D5).
          persist-credentials: false
      # No version input: setup-bun reads `packageManager` from package.json (D3).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: install
        run: bun install --frozen-lockfile
      - name: Validate commit messages
        # The SHAs arrive through `env`, never spliced into the script, and
        # the event's own SHAs handle a base branch that moved (D5).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Specs are this repository's source of truth: an invalid delta blocks a
  # merge like a type error (D6).
  specs:
    name: specs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version input: setup-bun reads `packageManager` from package.json (D3).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: install
        run: bun install --frozen-lockfile
      - name: Validate specs
        run: bunx openspec validate --all --strict --no-interactive
      # The living documents guard the same planning artifacts and need no
      # install or build, so they share this job rather than adding one
      # (design D4 in openspec/changes/archive/2026-10-18-living-docs/design.md).
      # The same step checks the notebook's entries and the relative links
      # (design D7 and D8 in openspec/changes/archive/2026-10-18-system-design-notebook/design.md).
      - name: Check living documents
        run: scripts/docs/check-living-docs.sh

  # CI audits itself, so this job cannot silently stop working (D7).
  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Official image pinned by tag and digest: the digest is what runs, the
      # tag is what Renovate reads to propose version updates. The documented
      # `curl | bash` install is an unpinned supply-chain hop this change
      # removes (D7).
      - name: Lint workflows (actionlint)
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      # SARIF upload is disabled: in SARIF mode zizmor always exits 0, which
      # would let findings pass; the action propagates the real exit code (D7).
      - name: Audit workflows (zizmor)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: "false"

  # A throwaway branch in the database project that only CI may reach (design
  # D7 in openspec/changes/content-store/design.md): migrations, the privilege
  # check and the integration tests run against it, and it is deleted whether
  # they pass or fail. Fork pull requests receive no secrets, so the first step
  # fails them instead of skipping, which keeps an untested migration out.
  database:
    name: database
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The secret arrives through `env`, never through `${{ }}` in `run:`
      # (D7). Its absence is the fork case: GitHub withholds the repository's
      # secrets from a fork pull request, so this is the only signal the job
      # gets. `ci-ok` counts the failure as a failure, never as a skip.
      - name: Require the CI database credential
        env:
          NEON_CI_API_KEY: ${{ secrets.NEON_CI_API_KEY }}
        run: |
          if [ -z "$NEON_CI_API_KEY" ]; then
            echo "Pull requests from forks are not accepted; see README."
            exit 1
          fi
      # A branch whose delete step fails anyway is removed by Neon after this
      # timestamp, so a failed cleanup cannot leave a compute running (D7).
      - name: Set the branch expiry
        id: expiry
        run: echo "expires_at=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # A name per attempt, so a re-run never reuses a branch the previous
      # attempt left behind (D7).
      - name: Create the CI database branch
        id: branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_CI_PROJECT_ID }}
          api_key: ${{ secrets.NEON_CI_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.expiry.outputs.expires_at }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # Later steps cannot reuse the token (D2).
      # No version input: setup-bun reads `packageManager` from package.json (D3).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: install
        run: bun install --frozen-lockfile
      # `db_url` is the branch's project owner role, the migrator every other
      # run of `migrate.ts` uses (A2). The step also ends with the privilege
      # check, so drift fails here before the tests (D7).
      - name: Migrate and check privileges
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: bun packages/db/scripts/migrate.ts
      - name: test:integration
        env:
          DATABASE_URL_TEST: ${{ steps.branch.outputs.db_url }}
        run: bun run test:integration
      # `always()` runs this after a failed migration or test too, which is the
      # point; the `outcome` guard keeps it from failing the fork case, where
      # no branch was ever created (D7).
      - name: Delete the CI database branch
        if: always() && steps.branch.outcome == 'success'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_CI_PROJECT_ID }}
          api_key: ${{ secrets.NEON_CI_API_KEY }}
          branch: ci-${{ github.run_id }}-${{ github.run_attempt }}

  # The single required check the ruleset pins, so jobs can be added or
  # renamed without touching branch protection (D1, D9). It fails on
  # `failure`, `cancelled`, and any skip other than `commits` on a push (D1).
  ci-ok:
    name: ci-ok
    needs: [verify, e2e, database, commits, specs, workflows]
    # Run even when a needed job failed, so the failure gets an aggregate
    # result on the commit (D1).
    if: always()
    runs-on: ubuntu-24.04
    env:
      # Job results arrive through the environment, never spliced into the
      # script (D1).
      VERIFY_RESULT: ${{ needs.verify.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
      DATABASE_RESULT: ${{ needs.database.result }}
      COMMITS_RESULT: ${{ needs.commits.result }}
      SPECS_RESULT: ${{ needs.specs.result }}
      WORKFLOWS_RESULT: ${{ needs.workflows.result }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Check every job
        run: |
          failed=0
          check_result() {
            job_name="$1"
            result="$2"
            case "$result" in
              success)
                echo "$job_name: success"
                ;;
              skipped)
                # `commits` only runs on pull requests; on a push to `main`
                # its skip is the expected one (D5).
                if [ "$job_name" = "commits" ] && [ "$EVENT_NAME" = "push" ]; then
                  echo "$job_name: skipped (expected on push)"
                else
                  echo "$job_name: unexpected skip"
                  failed=1
                fi
                ;;
              *)
                echo "$job_name: $result"
                failed=1
                ;;
            esac
          }
          check_result verify "$VERIFY_RESULT"
          check_result e2e "$E2E_RESULT"
          check_result database "$DATABASE_RESULT"
          check_result commits "$COMMITS_RESULT"
          check_result specs "$SPECS_RESULT"
          check_result workflows "$WORKFLOWS_RESULT"
          if [ "$failed" -ne 0 ]; then
            echo "One or more jobs did not succeed."
            exit 1
          fi
          echo "All jobs succeeded."
