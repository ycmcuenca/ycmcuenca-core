schema: spec-driven

context: |
  ycmcuenca-core is the owner's personal platform: a portfolio site, a
  hand-built CMS and the base for future satellite projects. It is a public
  repository, so nothing secret may ever be committed.

  Deployment target: Cloudflare Workers with static assets, on the Workers
  Free plan, so its limits (CPU time, subrequests, KV/R2 sizes) are hard
  constraints. Workers serve *.ycmcuenca.workers.dev until a custom domain is
  added. There is exactly one human editor: the admin app sits behind
  Cloudflare Access with a single user, so multi-user or role features are not
  needed.

  Locales are English (en), Filipino (fil) and Esperanto (eo). English content
  must exist before anything is published. The roadmap runs in sprints from S1
  (foundation) through S6 (content and 3D).

  The learning goal shapes trade-offs: the CMS is hand-built on purpose, while
  everything else stays on managed services. Prefer boring, widely adopted
  tools with clear upgrade seams.

  The sprint plan and the status of every change live in docs/ROADMAP.md. The
  platform-wide decisions and the parking lot of deferred work live in
  docs/DECISIONS.md. Both carry the planning context between sessions.

rules:
  proposal:
    - Read docs/ROADMAP.md and docs/DECISIONS.md before proposing. Build on their decided entries; if the change contradicts one, say so in the proposal and ask the owner before continuing.
    - Set the change's row in docs/ROADMAP.md to `proposed` (adding the row if the change was not listed) in the same branch as the proposal.
    - Scope each change to one capability area so it can be reviewed and merged as a single pull request.
    - Always state what is out of scope.
    - Name each change after the capability work it delivers (for example `ci-release-pipeline`), never after a sprint or a date.
    - Ask the owner about any ambiguity that affects scope, behavior, security or cost.
  specs:
    - Describe behavior only. Name libraries or platforms only when they are external constraints.
  design:
    - For every significant decision state the pattern, why it fits, the alternatives considered with their trade-offs, and the expected failure modes and their mitigation.
    - Record the version and date of every external fact, and take those facts from current documentation (Context7).
    - List facts that could not be verified as open questions, and list unconfirmed assumptions explicitly for the owner to review.
    - Link each `**Pattern:**` to its entry in docs/SYSTEM_DESIGN.md. When the pattern has no entry yet, add a planned entry in the same change.
  tasks:
    - Add a verification step for any behavior that has not been verified in this repository yet (external services, library behavior, platform limits).
    - Mark tasks only the owner can perform as an owner task and make the verification step explicit.

operations:
  archive:
    guidance:
      - Set the change's row in docs/ROADMAP.md to `archived`, and record any platform-wide decision the change made or overturned in docs/DECISIONS.md.
      - Review every living document in docs/ (ARCHITECTURE.md, DESIGN.md, PRODUCT.md, ROADMAP.md, SYSTEM_DESIGN.md, USER_JOURNEY.md) and update the ones this change affects, including their Mermaid diagrams, in the same branch before archiving.
      - 'Complete the docs/SYSTEM_DESIGN.md entries for the concepts this change applies: turn a planned entry into a built one, or add a new entry. Draft "What we learned here" from the change''s design risks, open questions and follow-ups, starting with the line `> Draft: awaiting the owner''s rewrite.`, and leave the rewrite to the owner.'
      - If docs/ does not exist yet, report that there were no living documents to sync and continue.
