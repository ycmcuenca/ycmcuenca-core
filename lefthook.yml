# Local git hooks (design D8). Hooks can be bypassed (--no-verify,
# --ignore-scripts), so CI re-enforces the same rules in ci-release-pipeline.
#
# Tool commands go through `bunx`: when Git runs a hook, node_modules/.bin is
# not on PATH, and bunx resolves the local binaries reliably.
pre-commit:
  parallel: true
  jobs:
    # Format everything Prettier understands and re-stage the fixes.
    # Prettier skips .prettierignore'd files (bun.lock, build output, the
    # generated worker types) even when they are passed explicitly.
    - name: prettier
      glob:
        - "*.{css,html,js,json,jsonc,md,mjs,svelte,ts,yml,yaml}"
        - "**/*.{css,html,js,json,jsonc,md,mjs,svelte,ts,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    # Lint every staged file whose type the shared config covers: JavaScript,
    # TypeScript, Svelte, JSON, YAML and Markdown. ESLint 10 resolves the
    # nearest config per file, so each member lints with its own.
    # --no-warn-ignored keeps generated files (already ignored by the shared
    # config) from printing an advisory on every commit.
    - name: eslint
      glob:
        - "*.{cjs,js,json,jsonc,md,mjs,svelte,ts,yaml,yml}"
        - "**/*.{cjs,js,json,jsonc,md,mjs,svelte,ts,yaml,yml}"
      run: bunx eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

# Check the commit message itself. {1} is the path of the message file Git
# hands to the hook.
commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
